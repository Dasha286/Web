<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacts</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  
</head>
<body>
 
  <header id="header-container"></header>

  <section class="contact-info">
    <h2>Як з нами зв'язатися?</h2>
    <p><strong>Адреса:</strong> Хмельницький Цирк, Зарічанська 10, Хмельницький, Україна</p>
    <p><strong>Телефон:</strong> (0382) 63-05-05</p>
    <p><strong>Email:</strong> <a href="hpk@ic.km.ua">hpk@ic.km.ua</a></p>
    <p><strong>Години роботи:</strong> Пн-Нд: 10:00 - 20:00</p>
</section>
 

<section class="contact-form">
    <h2>Зворотний зв'язок</h2>
    <form>
      <div class="input-row">
          <div>
              <label for="name">Ваше ім'я:</label>
              <input type="text" id="name" name="name" required>
          </div>
          <div>
              <label for="email">Ваш email:</label>
              <input type="email" id="email" name="email" required>
          </div>
      </div>
  
      <label for="message">Ваше повідомлення:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
  
      <button type="submit">Надіслати</button>
  </form>
  
  
</section>

<section class="social-media">
    <h2>Слідкуйте за нами</h2>
    <ul class="social-links">
      <li><a href="https://www.instagram.com/kyivcircus/" target="_blank"><i class="fab fa-instagram"></i></a></li>
      <li><a href="https://www.facebook.com/circuskyiv/" target="_blank"><i class="fab fa-facebook"></i></a></li>
  </ul>
</section>

  <footer id="footer-container"></footer>
  <script>
 
 fetch('/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        
        
        const menuToggle = document.getElementById("mobile-menu");
        const navList = document.getElementById("nav-list");
  
        if (menuToggle && navList) {
          menuToggle.addEventListener("click", function () {
            navList.classList.toggle("active");
          });
        }
      })
      .catch(error => console.error('Помилка завантаження header.html:', error));
  
   
    fetch('/footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer-container').innerHTML = data)
      .catch(error => console.error('Помилка завантаження footer.html:', error));
  </script>
</body>
</html>
